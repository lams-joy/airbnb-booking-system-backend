services:
  # 1. Go Backend Microservice
  - type: web
    name: airbnb-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-postgis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: airbnb-redis
          property: connectionString

  # 2. Next.js Frontend App
  - type: web
    name: airbnb-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    context: ./frontend
    region: oregon
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: airbnb-backend
          property: url

  # 3. Managed Redis Cache
  - type: redis
    name: airbnb-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # 4. PostgreSQL Database
  - name: airbnb-postgis-db
    region: oregon
    plan: free
    databaseName: airbnb_db
    user: postgres
